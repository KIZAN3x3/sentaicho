<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>選対スケジュール帳</title>
  <script>
    // GitHub Pages は /sentaicho/aichi などのURLを直接開くとこのページを返す。
    // 元のパスを ?p= に入れてトップ（index.html）へ移し、index.html 側で元のパスに戻す。
    (function () {
      var base = '/sentaicho';
      var l = window.location;
      var path = l.pathname.indexOf(base) === 0 ? l.pathname.slice(base.length) : l.pathname;
      l.replace(base + '/?p=' + encodeURIComponent(path + l.search) + l.hash);
    })();
  </script>
</head>
<body></body>
</html>
